name: mac-app
# Builds AniTrack.app on a Mac whenever the app's code changes, for Apple Silicon and Intel, and
# publishes both as the "AniTrack for Mac" download (release tag mac-latest, replaced each time).
on:
  push:
    branches: [main]
    paths: ['src/**', 'renderer/**', 'build/**', 'extension/match.js', 'package.json', 'scripts/build-app.sh', '.github/workflows/mac-app.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    env:
      # Optional: a castlabs EVS account (free) adds the Widevine signature Crunchyroll needs to play
      # video inside the app. Add these as repository secrets; without them the app is built unsigned.
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # the Widevine Electron build needs Node 22.12 or later
      - name: Fetch GitHub packages over HTTPS
        # npm falls back to SSH for github: packages when HTTPS hiccups, and runners have no SSH key.
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - name: Test
        run: npm test
      - uses: actions/setup-python@v5
        if: env.EVS_ACCOUNT_NAME != ''
        with:
          python-version: '3.12'
      - name: Log in to castlabs EVS (Widevine signing)
        if: env.EVS_ACCOUNT_NAME != ''
        run: |
          python -m pip install --upgrade castlabs-evs
          python -m castlabs_evs.account -n reauth -A "$EVS_ACCOUNT_NAME" -P "$EVS_PASSWD"
          echo "VMP_SIGN=1" >> "$GITHUB_ENV"
      # Each architecture needs its own Electron download, so install and build twice.
      - name: Build for Apple Silicon
        run: |
          for i in 1 2 3; do npm_config_arch=arm64 npm install --no-audit --no-fund && break; [ $i = 3 ] && exit 1; sleep 20; done
          NO_INSTALL=1 bash scripts/build-app.sh
          ditto -c -k --keepParent dist/AniTrack.app AniTrack-mac-apple-silicon.zip
      - name: Build for Intel
        run: |
          rm -rf node_modules dist
          for i in 1 2 3; do npm_config_arch=x64 npm install --no-audit --no-fund && break; [ $i = 3 ] && exit 1; sleep 20; done
          NO_INSTALL=1 bash scripts/build-app.sh
          lipo -archs dist/AniTrack.app/Contents/MacOS/Electron | grep -q x86_64
          ditto -c -k --keepParent dist/AniTrack.app AniTrack-mac-intel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AniTrack-mac
          path: AniTrack-mac-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AniTrack-mac
      - name: Publish the download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create mac-latest AniTrack-mac-*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "AniTrack for Mac" --notes "Download the zip for your Mac (Apple Silicon: M1 and later; Intel: older Macs), open it, and drag AniTrack to Applications.

          The first time you open it, macOS will say it can't check the app (it isn't from the App Store). Go to System Settings > Privacy & Security, scroll down and click **Open Anyway**. You only need to do this once.

          Built from $GITHUB_SHA."
